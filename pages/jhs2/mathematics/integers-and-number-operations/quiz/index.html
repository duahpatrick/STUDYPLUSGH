<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Integers Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head>
<body>
<nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li><li><a href="#">Premium</a></li></ul></nav>
<section class="hero"><h1><span>Integers</span> Quiz</h1><p>JHS 2 Mathematics</p></section>
<section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section>
<footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer>
<script>
const questions=[['Which integer is greater?',['-9','-4','-12','-20'],'B'],['Calculate -7 + 12.',['-19','-5','5','19'],'C'],['Calculate 6 - (-5).',['1','-1','11','-11'],'C'],['Calculate (-8) × 3.',['24','-24','-11','11'],'B'],['Calculate (-36) ÷ (-4).',['-9','9','32','-32'],'B']];
const form=document.getElementById('quizForm');
questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});
form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');
form.addEventListener('submit',event=>{event.preventDefault();let score=0;questions.forEach((item,index)=>{if(new FormData(form).get(`q${index}`)===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Score</h2><p>You scored <strong>${score} out of ${questions.length}</strong>. ${score===questions.length?'Excellent work!':'Review the lesson and try again.'}</p>`;result.scrollIntoView({behavior:'smooth'});});
</script></body></html>
