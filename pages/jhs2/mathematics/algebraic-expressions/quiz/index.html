<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Algebraic Expressions Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li></ul></nav><section class="hero"><h1><span>Algebraic Expressions</span> Quiz</h1><p>JHS 2 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['How many terms are in 4x + 2y - 6?',['2','3','4','6'],'B'],['Simplify 5a + 2a.',['7','7a','10a','3a'],'B'],['If x=3, find 4x+1.',['7','12','13','15'],'C'],['Expand 3(y+2).',['3y+2','y+6','3y+6','5y'],'C'],['Simplify 8m-3m+4.',['5m+4','11m+4','5m-4','8m+1'],'A']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;const answers=new FormData(form);questions.forEach((item,index)=>{if(answers.get(`q${index}`)===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Score</h2><p>You scored <strong>${score} out of ${questions.length}</strong>. ${score===questions.length?'Excellent work!':'Review the lesson and try again.'}</p>`;result.scrollIntoView({behavior:'smooth'});});</script></body></html>
