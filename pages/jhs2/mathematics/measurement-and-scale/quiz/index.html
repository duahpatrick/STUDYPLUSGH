<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Measurement and Scale Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li></ul></nav><section class="hero"><h1><span>Measurement and Scale</span> Quiz</h1><p>JHS 2 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['3 m equals...',['30 cm','300 cm','3,000 cm','0.3 cm'],'B'],['2,500 g equals...',['0.25 kg','2.5 kg','25 kg','250 kg'],'B'],['Perimeter of a 7 cm by 4 cm rectangle?',['11 cm','18 cm','22 cm','28 cm'],'C'],['Area of a 9 m by 3 m rectangle?',['12 m²','18 m²','27 m²','36 m²'],'C'],['At 1 cm : 4 m, 5 cm represents...',['9 m','16 m','20 m','25 m'],'C']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;const answers=new FormData(form);questions.forEach((item,index)=>{if(answers.get(`q${index}`)===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Score</h2><p>You scored <strong>${score} out of ${questions.length}</strong>. ${score===questions.length?'Excellent work!':'Review the lesson and try again.'}</p>`;result.scrollIntoView({behavior:'smooth'});});</script></body></html>
