<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Angles and Shapes Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li></ul></nav><section class="hero"><h1><span>Angles and Shapes</span> Quiz</h1><p>JHS 2 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['What type of angle is 35°?',['Right','Acute','Obtuse','Straight'],'B'],['115° + x = 180°. Find x.',['55°','65°','75°','95°'],'B'],['A triangle has angles 40° and 80°. Find the third angle.',['40°','50°','60°','80°'],'C'],['Interior angles of a quadrilateral total...',['180°','270°','360°',' 넷'],'C'],['How many right angles does a rectangle have?',['2','3','4','5'],'C']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;const answers=new FormData(form);questions.forEach((item,index)=>{if(answers.get(`q${index}`)===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Score</h2><p>You scored <strong>${score} out of ${questions.length}</strong>. ${score===questions.length?'Excellent work!':'Review the lesson and try again.'}</p>`;result.scrollIntoView({behavior:'smooth'});});</script></body></html>
