<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Algebra Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li><li><a href="#">Premium</a></li></ul></nav><section class="hero"><h1><span>Algebra</span> Quiz</h1><p>JHS 1 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['Coefficient of x in 4x + 7?',['4','7','x','11'],'A'],['Simplify 3a + 5a.',['8','8a','15a','2a'],'B'],['If x=5, find x+9.',['4','9','14','45'],'C'],['Solve x+6=15.',['6','9','15','21'],'B'],['Solve 4x=28.',['4','6','7','24'],'C'],['Which pair has like terms?',['3x and 5x','2a and 2b','4 and 4y','x and x²'],'A'],['Expand 2(x+3).',['2x+3','x+6','2x+6','5x'],'C'],['If y=3, find 5y-1.',['4','14','15','16'],'B'],['Solve 2m-3=9.',['3','6','9','12'],'B'],['Which is an algebraic expression?',['7+2','3x+4','5=5','12'],'B']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;questions.forEach((item,index)=>{if(document.querySelector(`input[name="q${index}"]:checked`)?.value===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Result</h2><br><h3>${score} / ${questions.length}</h3><br><p>Score: ${(score/questions.length)*100}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;result.scrollIntoView({behavior:'smooth'})});</script></body></html>
