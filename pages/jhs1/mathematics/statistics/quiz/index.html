<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Statistics Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li><li><a href="#">Premium</a></li></ul></nav><section class="hero"><h1><span>Statistics</span> Quiz</h1><p>JHS 1 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['Mode of 2, 4, 2, 5, 2?',['2','4','5','15'],'A'],['Range of 3, 8, 5, 10?',['5','7','8','13'],'B'],['Mean of 4, 6 and 8?',['4','6','8','18'],'B'],['Median of 2, 5, 7, 9, 10?',['5','7','8','9'],'B'],['What is frequency?',['Largest value','How often a value occurs','Average','Smallest value'],'B'],['Which graph compares categories with bars?',['Bar chart','Line graph','Number line','Pie scale'],'A'],['Total frequency of 1, 2, 2, 3, 4, 4?',['4','5','6','16'],'C'],['Median of 6, 2, 9?',['2','6','9','17'],'B'],['What explains a graph subject?',['A title','A question mark','A fraction','A compass'],'A'],['Mean of 5, 5, 10 and 20?',['5','8','10','40'],'C']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;questions.forEach((item,index)=>{if(document.querySelector(`input[name="q${index}"]:checked`)?.value===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Result</h2><br><h3>${score} / ${questions.length}</h3><br><p>Score: ${(score/questions.length)*100}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;result.scrollIntoView({behavior:'smooth'})});</script></body></html>
