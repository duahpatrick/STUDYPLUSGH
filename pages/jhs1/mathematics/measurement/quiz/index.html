<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Measurement Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li><li><a href="#">Premium</a></li></ul></nav><section class="hero"><h1><span>Measurement</span> Quiz</h1><p>JHS 1 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['How many centimetres are in 3 metres?',['30','300','3,000','0.3'],'B'],['Best unit for a bag of rice?',['Millimetre','Litre','Kilogram','Centimetre'],'C'],['Perimeter of a square with side 6 cm?',['12 cm','18 cm','24 cm','36 cm'],'C'],['Area of a 7 cm by 4 cm rectangle?',['11 cm²','22 cm²','28 cm²','49 cm²'],'C'],['How many grams are in 2 kg?',['20','200','2,000','20,000'],'C'],['How many minutes are in 2 hours?',['60','100','120','240'],'C'],['Perimeter of a 10 m by 3 m rectangle?',['13 m','20 m','26 m','30 m'],'C'],['Which unit measures liquid capacity?',['Litre','Metre','Gram','Square metre'],'A'],['What is 450 cm in metres?',['0.45 m','4.5 m','45 m','450 m'],'B'],['8:00 a.m. to 9:30 a.m. is how long?',['30 minutes','1 hour','1 hour 30 minutes','2 hours'],'C']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card);const gap=document.createElement('br');form.append(gap)});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;questions.forEach((item,index)=>{if(document.querySelector(`input[name="q${index}"]:checked`)?.value===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Result</h2><br><h3>${score} / ${questions.length}</h3><br><p>Score: ${(score/questions.length)*100}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;result.scrollIntoView({behavior:'smooth'})});</script></body></html>
