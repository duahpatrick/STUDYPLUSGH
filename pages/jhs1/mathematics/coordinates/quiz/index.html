<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Coordinates Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li><li><a href="index.html">Quiz</a></li><li><a href="#">Premium</a></li></ul></nav><section class="hero"><h1><span>Coordinates</span> Quiz</h1><p>JHS 1 Mathematics</p></section><section class="section"><form id="quizForm"></form><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const questions=[['What is the origin?',['(1,1)','(0,0)','(0,1)','(1,0)'],'B'],['x-coordinate of (4,2)?',['2','4','6','-4'],'B'],['Direction of positive y?',['Left','Right','Up','Down'],'C'],['Point 3 left and 2 up?',['(3,2)','(-3,2)','(3,-2)','(-2,3)'],'B'],['Reflection of (5,2) in x-axis?',['(-5,2)','(5,-2)','(-5,-2)','(2,5)'],'B'],['Point on the y-axis?',['(4,0)','(0,4)','(4,4)','(-4,4)'],'B'],['Distance between (2,3) and (7,3)?',['3','5','7','10'],'B'],['y-coordinate of (-2,-6)?',['-2','2','-6','6'],'C'],['Move (1,2) 3 right.',['(4,2)','(1,5)','(-2,2)','(3,4)'],'A'],['Point in the lower-left direction?',['(2,3)','(-2,3)','(2,-3)','(-2,-3)'],'D']];const form=document.getElementById('quizForm');questions.forEach((item,index)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<h3>Question ${index+1}</h3><p>${item[0]}</p><br>${item[1].map((option,choice)=>`<label><input type="radio" name="q${index}" value="${String.fromCharCode(65+choice)}"> ${String.fromCharCode(65+choice)}. ${option}</label><br>`).join('')}`;form.append(card,document.createElement('br'))});form.insertAdjacentHTML('beforeend','<button type="submit" class="btn">Submit Quiz</button>');form.addEventListener('submit',event=>{event.preventDefault();let score=0;questions.forEach((item,index)=>{if(document.querySelector(`input[name="q${index}"]:checked`)?.value===item[2])score++});const result=document.getElementById('result');result.style.display='block';result.innerHTML=`<h2>Your Result</h2><br><h3>${score} / ${questions.length}</h3><br><p>Score: ${(score/questions.length)*100}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;result.scrollIntoView({behavior:'smooth'})});</script></body></html>
