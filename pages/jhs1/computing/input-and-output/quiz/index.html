<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Input and Output Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Input and Output <span>Quiz</span></h1><p>JHS 1 Computing</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Input is',['data entered','a result','a printer','a sound']],['Processing is',['work done on data','typing only','printing only','saving paper']],['Output is',['a presented result','raw data','a keyboard','a cable']],['A mouse is',['an input device','an output device','storage','a user']],['A monitor is',['an output device','an input device','an algorithm','a file']],['Sound can be entered with a',['microphone','printer','monitor','projector']],['A scanner enters',['images or printed data','sound only','electricity','paper output']],['Paper output comes from a',['printer','mouse','keyboard','microphone']],['Adding numbers is',['processing','input','storage','paper output']],['A touchscreen can be',['input and output','only storage','only software','only a user']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
