<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Computer Systems Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Computer Systems <span>Quiz</span></h1><p>JHS 1 Computing</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Hardware is',['physical equipment','instructions','a user','a password']],['Software is',['instructions for hardware','a monitor','a cable','a desk']],['A keyboard is',['hardware','software','a user','data']],['The CPU',['processes instructions','prints paper','cleans screens','stores books']],['A user is',['a person operating a computer','a chip','a file','a cable']],['A word processor is',['software','hardware','a cable','a screen']],['A monitor is an',['output device','input device','algorithm','user']],['Moisture can',['damage equipment','improve circuits','save files','print documents']],['A fault should be',['reported','hidden','ignored','celebrated']],['Data is',['raw facts','finished furniture','a screen','a cable']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}...</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});let r=
