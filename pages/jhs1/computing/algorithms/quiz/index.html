<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algorithms Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Algorithms <span>Quiz</span></h1><p>JHS 1 Computing</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['An algorithm is',['ordered instructions','a monitor','a file type','a password']],['Steps need order to',['get the intended result','make noise','delete data','change colour']],['A problem is',['a task needing a solution','a keyboard','a folder','a speaker']],['A good algorithm has',['a clear finish','infinite confusion','no start','random steps']],['Clear instructions are',['easy to understand','secret always','impossible','unrelated']],['Testing helps find',['errors','cables','paper','users']],['Preparing a drink can be',['an everyday algorithm','a monitor','a virus','a folder']],['An instruction gives',['a direction for an action','a storage device','a screen','a password']],['Before writing steps',['understand the problem','skip the task','delete the result','guess randomly']],['An incorrect step causes',['an error','a backup','a folder','a printer']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
