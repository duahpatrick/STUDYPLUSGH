<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stewardship Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Stewardship <span>Quiz</span></h1><p>JHS 1 RME</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Stewardship means',['responsible care','waste','destruction','neglect']],['People can steward',['time and talents','only roads','weather','noise']],['Unused lights should be',['switched off','left on','broken','hidden']],['Water is conserved by',['closing unused taps','polluting streams','wasting it','leaving leaks']],['School property is',['shared','worthless','private rubbish','unimportant']],['Littering causes',['an unhealthy environment','clean air','more trees','good water']],['Trees help protect',['soil and nature','litter','disease','noise']],['Talents should be used to',['help constructively','harm others','waste time','cheat']],['Responsible use avoids',['waste and damage','care','sharing','protection']],['Stewardship is for',['everyone','leaders only','adults only','visitors only']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
