<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>God and Creation Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>God and Creation <span>Quiz</span></h1><p>JHS 1 RME</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Many traditions describe God as',['creator','a road','a building','a tool']],['Creation includes',['living and non-living things','books only','money only','machines only']],['Gratitude means',['thankfulness','anger','fear','waste']],['People depend on nature for',['food and water','passwords','televisions','uniforms']],['Caring for nature shows',['responsibility','laziness','dishonesty','cruelty']],['A useful resource is',['water','litter','disease','noise']],['A clean compound shows',['care','neglect','waste','harm']],['Beliefs should be discussed with',['respect','mockery','anger','prejudice']],['Planting trees helps protect',['creation','litter','disease','noise']],['A good attitude to life is',['appreciation','destruction','waste','hatred']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
