<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family and Community Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Family and Community <span>Quiz</span></h1><p>JHS 1 RME</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Families provide',['care and support','only rules','pollution','confusion']],['A good family needs',['love and fairness','fear','insults','neglect']],['Service means',['helping others','taking everything','causing harm','refusing help']],['Peace means living without',['harmful conflict','kindness','respect','cooperation']],['Conflict can be solved by',['calm discussion','fighting','threats','rumours']],['Forgiveness can restore',['relationships','litter','disease','noise']],['Dignity is the worth of',['every person','only leaders','property','money']],['Cooperation achieves',['shared goals','damage','conflict','waste']],['Helping a neighbour is',['service','pollution','dishonesty','neglect']],['Respectful words can build',['peace','anger','harm','fear']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
