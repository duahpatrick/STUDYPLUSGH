<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moral Values Quiz | StudyPlus GH</title><link rel="stylesheet" href="../../../../../style.css"></head><body><nav class="navbar"><div class="logo">StudyPlus GH</div><ul class="nav-links"><li><a href="../../../../../index.html">Home</a></li><li><a href="../index.html">Lesson</a></li><li><a href="../practice.html">Practice</a></li></ul></nav><section class="hero"><h1>Moral Values <span>Quiz</span></h1><p>JHS 1 RME</p></section><section class="section"><form id="quiz"></form><button class="btn" form="quiz">Submit Quiz</button><div id="result" class="card" style="display:none;margin-top:30px"></div></section><footer class="footer"><p>© 2026 StudyPlus GH. Learn. Practice. Succeed.</p></footer><script>const qs=[['Honesty means',['speaking truthfully','hiding facts','cheating','blaming']],['Respect means treating others with',['care','anger','mockery','neglect']],['Kindness responds to',['others’ needs','only money','noise','damage']],['Self-control manages',['actions and feelings','the weather','a printer','a road']],['Returning lost property is',['honest','unfair','harmful','lazy']],['An apology should include',['correcting harm','more insults','denial','revenge']],['Values guide',['choices','rainfall','electricity','buildings']],['Cheating is',['dishonest','fair','kind','responsible']],['Fairness means treating people',['justly','cruelly','secretly','unequally']],['Good values should be practised',['consistently','never','only for prizes','only at school']];const f=document.getElementById('quiz');qs.forEach((q,i)=>f.innerHTML+=`<div class="card"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${a}</label><br>`).join('')}</div><br>`);f.onsubmit=e=>{e.preventDefault();let s=0;qs.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`)?.value==='0')s++});const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Your Result</h2><br><h3>${s} / 10</h3><br><p>Score: ${s*10}%</p><br><button onclick="location.reload()" class="btn">Try Again</button>`;r.scrollIntoView({behavior:'smooth'})}</script></body></html>
